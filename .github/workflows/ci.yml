name: CI

# Revisa cada cambio antes de unirlo: estilo, pruebas, build y dependencias.
# Solo corre si cambió código, base de datos, dependencias o configuración.
# Cambios solo de documentación (README, .md, .gitignore, robots...) no lo disparan.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'ngsw-config.json'
      - 'wrangler.jsonc'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'vitest.config.mts'
      - 'playwright.config.ts'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'ngsw-config.json'
      - 'wrangler.jsonc'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'vitest.config.mts'
      - 'playwright.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Revisar el script de migraciones
        run: bash -n scripts/migrate.sh

      - name: Lint (eslint, tipos e2e y prettier)
        run: npm run lint

      - name: Pruebas unitarias
        run: npx ng test --no-watch

      - name: Build de producción
        run: npx ng build

      - name: Subir el build
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 7

  e2e:
    name: Pruebas e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El proyecto usa el Chrome instalado (channel: chrome); ubuntu-latest ya lo trae.
      - name: Ejecutar e2e
        run: npx playwright test
        env:
          CI: 'true'

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  seguridad:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Solo lo que llega a producción; las herramientas de desarrollo no entran al build.
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Revisar que no haya claves privadas en el repositorio
        run: node scripts/check-secrets.mjs
