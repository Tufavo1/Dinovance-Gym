name: CodeQL

# Análisis estático de seguridad del código TypeScript.
# Solo analiza si cambió código; además corre cada lunes por si aparecen vulnerabilidades nuevas.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  schedule:
    - cron: '23 5 * * 1'

# actions: read lo necesita CodeQL en repositorios privados para leer los datos de la ejecución.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analizar:
    name: Analizar JavaScript y TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
